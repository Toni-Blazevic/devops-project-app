name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install API dependencies
        working-directory: ./api
        run: npm install

      - name: Install Worker dependencies
        working-directory: ./worker
        run: npm install

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build API image
        run: docker build -t ticketing-api ./api

      - name: Build Worker image
        run: docker build -t ticketing-worker ./worker

      - name: Build Frontend image
        run: docker build -t ticketing-frontend ./frontend

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-api:latest
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
        
      - name: Scan Worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-worker:latest
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-frontend:latest
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ticketing-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-api:latest
          docker tag ticketing-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-api:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-api:${{ github.sha }}

      - name: Push Worker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ticketing-worker:latest ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-worker:latest
          docker tag ticketing-worker:latest ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-worker:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-worker:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-worker:${{ github.sha }}

      - name: Push Frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ticketing-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-frontend:latest
          docker tag ticketing-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-frontend:${{ github.sha }}

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ticketing-frontend:${{ github.sha }}