apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: ticketing

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api
  
  template:
    metadata:
      labels:
        app: api
  
    spec:

      serviceAccountName: api-sa

      containers:
        - name: api
          image: toni680/ticketing-api:v2
          imagePullPolicy: IfNotPresent
          
          ports:
            - containerPort: 8080
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              
          envFrom:
            - configMapRef:
                name: ticketing-config
            - secretRef:
                name: ticketing-secret
          
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

