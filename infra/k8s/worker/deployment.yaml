apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker
  namespace: ticketing

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: toni680/ticketing-worker:latest
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          envFrom:
            - configMapRef:
                name: ticketing-config
            - secretRef:
                name: ticketing-secret